[project]
name = "blockstrat"
version = "0.1.0"
description = "BlockStrat backend: strategy schema, market data and backtests"
authors = [
    { name = "Jakub Janik", email = "JJanik2k@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "backtesting>=0.6.6",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "pandas<3",
    "pydantic>=2.14.3",
    "ta>=0.11.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
