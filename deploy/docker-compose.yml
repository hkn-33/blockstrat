services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - market-data:/data
    # No published ports: only Caddy can reach the backend.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  market-data:
  caddy-data:
  caddy-config:
