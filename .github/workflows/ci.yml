# Checks every push and pull request, then deploys `main` to production only when every check passed.
# Vercel's and Coolify's own deploy-on-push for `main` is turned off for this (see docs/deployment.md).
name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push replaces checks still running, except on `main`, where that would cut a deploy in half.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          # The same uv as the Dockerfile.
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          working-directory: backend
      - run: uv sync --locked
      - run: uv run pytest

  backend-image:
    # Coolify builds this Dockerfile on deploy; a broken image should fail here, not on the server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, backend-image, frontend]
    runs-on: ubuntu-latest
    # One production deploy at a time, and a newer push never cancels one halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Deploy the backend (Coolify)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

      - name: Deploy the frontend (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # Uploads the repository; Vercel builds it with the project's own settings (root directory `frontend`).
        run: npx --yes vercel@65.16.0 deploy --prod --yes --token "$VERCEL_TOKEN"
